services:
  simulacrum-db:
    image: postgres:16
    container_name: simulacrum-db
    environment:
      POSTGRES_DB: simulacrum
      POSTGRES_USER: simulacrum
      POSTGRES_PASSWORD: simulacrum
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulacrum -d simulacrum"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: simulacrum-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
