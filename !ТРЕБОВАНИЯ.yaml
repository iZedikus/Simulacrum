# Спецификация требований к информационной системе (ИС)
version: 1.0

# Общие требования к инфраструктуре
general_requirements:
  database:
    type: PostgreSQL
    note: "ИС не должна использовать in-memory хранилище"
  message_broker:
    type: RabbitMQ
    note: "ИС должна взаимодействовать с другими сервисами через RabbitMQ помимо API"

# Общее правило для всех микросервисов (топология RabbitMQ)
common_rabbitmq_rule: |
  Каждый микросервис при запуске самостоятельно объявляет (через @Bean Queue, @Bean Binding) 
  только те очереди, из которых он читает, и, возможно, exchange, в который он пишет 
  (если exchange может отсутствовать). Обменники, используемые несколькими сервисами, 
  могут быть объявлены в каждом из них – это безопасно. 
  Не создавайте отдельный сервис для инициализации топологии RabbitMQ.

# Требования к акторам (ролям)
actors:
  - name: "Клиент-API"
    description: "Внешний клиент, вызывающий API сервиса"
    requirements:
      - id: "REGISTER_ACCEPT"
        description: "Зарегистрировать акцепт (согласие на списание средств)"
      - id: "REVOKE_ACCEPT"
        description: "Отозвать ранее зарегистрированный акцепт"
      - id: "INITIATE_DEBIT"
        description: "Инициировать списание средств на основании зарегистрированного акцепта"
      - id: "GET_DEBIT_STATUS"
        description: "Получить статус выполнения операции списания средств"
      - id: "GET_ACCOUNT_INFO"
        description: "Получить информацию о состоянии банковского счёта (баланс не нужен)"
      - id: "GET_TRANSACTION_HISTORY"
        description: "Получить историю транзакций по счёту (как расширение к информации о счёте)"

  - name: "Администратор симулякра"
    description: "Администратор, управляющий тестовыми данными и наблюдающий за системой"
    requirements:
      - id: "CREATE_TEST_USER_ACCOUNT"
        description: "Создавать тестовых пользователей и тестовые банковские счета"
      - id: "GENERATE_TEST_TRANSACTION"
        description: "Сгенерировать тестовую транзакцию с указанным кодом MCC (Merchant Category Code). Транзакция должна быть опубликована в очередь RabbitMQ."
      - id: "VIEW_REQUEST_LOG"
        description: "Вести и отображать журнал всех входящих запросов к API (доступно администратору)"